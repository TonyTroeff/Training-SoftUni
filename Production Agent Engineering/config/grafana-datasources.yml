apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: n8n.workflow.name
            value: workflow_name
        queries:
          - name: "Node execution rate for this workflow"
            query: 'sum by (node_type) (rate(n8n_node_started_total{$$__tags}[$$__rate_interval]))'
