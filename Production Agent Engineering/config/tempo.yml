stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 1m
  complete_block_timeout: 15m

compactor:
  compaction:
    # The dashboards count events by querying the spans themselves, so this retention IS the dashboard's history.
    # Anything older than this window is gone, not just un-graphed.
    block_retention: 168h

# TraceQL metrics (`count_over_time`, `quantile_over_time`, ...) let Grafana derive counts and latencies from the stored spans on every query, instead of reading counters that reset on restart.
query_frontend:
  metrics:
    # Refuse nothing the time picker can reasonably ask for - keep this >= `block_retention`.
    max_duration: 168h
    query_backend_after: 30m
    interval: 5m

metrics_generator:
  storage:
    path: /var/tempo/generator/wal
  traces_storage:
    path: /var/tempo/generator/traces
  processor:
    local_blocks:
      # n8n emits workflow/node spans as INTERNAL, not SERVER.
      # Left at the default `true` the processor keeps nothing at all and every TraceQL metrics query answers zero.
      filter_server_spans: false
      flush_to_storage: true

storage:
  trace:
    backend: local
    blocklist_poll: 30s
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

overrides:
  defaults:
    metrics_generator:
      processors:
        - local-blocks
      # A span is exported when it ENDS, so a workflow that ran for a few minutes arrives with a start timestamp well in the past.
      # At the default of 0s the generator drops exactly those spans - the long executions worth watching - before they ever reach a block.
      ingestion_time_range_slack: 1h
