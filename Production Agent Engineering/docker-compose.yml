services:
  caddy:
    image: caddy:2.11.4
    container_name: softuni_ai_caddy
    ports:
      - 8443:443
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  # NOTE: Tony Troeff, 25/08/2026 - The free ngrok tier grants one reserved domain per account, so `--url` keeps the public address stable across restarts.
  # Without it ngrok hands out a random hostname on every start and `N8N_WEBHOOK_URL` would have to be rewritten each time.
  ngrok:
    image: ngrok/ngrok:3
    container_name: softuni_ai_ngrok
    depends_on:
      - n8n
    ports:
      - 4040:4040 # Local inspector (also exposes /api/tunnels)
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "n8n:5678"
      - "--url=${NGROK_DOMAIN}"
      - "--log=stdout"

  # NOTE: Tony Troeff, 11/08/2026 - To host n8n on a non-localhost address on Windows, add an entry to the "hosts" file.
  n8n:
    image: n8nio/n8n:2.35.3
    container_name: softuni_ai_n8n
    depends_on:
      - caddy
      - chromadb
      - grafana
    ports:
      - 5678:5678
    environment:
      - N8N_HOST=n8n.troeff.com
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://n8n.troeff.com:8443/

      # NOTE: Tony Troeff, 25/08/2026 - To use the "Telegram Trigger", n8n must be publicly accessible, so production webhooks are published through the ngrok tunnel instead, while the editor keeps using the local Caddy address.
      - N8N_WEBHOOK_URL=https://${NGROK_DOMAIN}/

      - N8N_PROXY_HOPS=1

      # NOTE: Tony Troeff, 13/08/2026 - `N8N_METRICS=true` alone only exposes process/runtime metrics plus a workflow-execution histogram labelled with `status` and `mode` only.
      - N8N_METRICS=true
      - N8N_METRICS_INCLUDE_WORKFLOW_ID_LABEL=true
      - N8N_METRICS_INCLUDE_WORKFLOW_INFO=true
      - N8N_METRICS_INCLUDE_WORKFLOW_NAME_LABEL=true
      - N8N_METRICS_INCLUDE_NODE_TYPE_LABEL=true
      - N8N_METRICS_INCLUDE_MESSAGE_EVENT_BUS_METRICS=true
      - N8N_METRICS_INCLUDE_WEBHOOK_METRICS=true

      - N8N_OTEL_ENABLED=true
      - N8N_OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318
      - N8N_OTEL_EXPORTER_SERVICE_NAME=n8n

      # Defaults to `true`, which would drop every "Test workflow" run from the editor.
      # Manual runs are exactly what gets demonstrated in a lecture, so trace those too.
      - N8N_OTEL_TRACES_PRODUCTION_ONLY=false
    volumes:
      - n8n_data:/home/node/.n8n

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: softuni_ai_chromadb
    ports:
      - 8000:8000
    volumes:
      - chromadb_data:/data

  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: softuni_ai_prometheus
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  tempo:
    image: grafana/tempo:2.9.0
    container_name: softuni_ai_tempo
    ports:
      - 3200:3200 # Tempo API (Grafana queries this)
      - 4318:4318 # OTLP/HTTP receiver (n8n exports to this)
    volumes:
      - ./config/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    command:
      - "-config.file=/etc/tempo.yml"

  loki:
    image: grafana/loki:3.7.6
    container_name: softuni_ai_loki
    ports:
      - 3100:3100
    volumes:
      - ./config/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki.yml"

  grafana:
    image: grafana/grafana:13.0
    container_name: softuni_ai_grafana
    depends_on:
      - prometheus
      - tempo
      - loki
    ports:
      - 3000:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=1s

volumes:
  caddy_data:
  n8n_data:
  chromadb_data:
  prometheus_data:
  grafana_data:
  tempo_data:
  loki_data:

networks:
  default:
    name: softuni.ai
