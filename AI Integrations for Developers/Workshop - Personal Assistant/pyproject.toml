[project]
name = "personal-assistant"
version = "0.1.0"
description = "Desktop chat shell for a personal AI assistant, built on tkinter."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.47.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.scripts]
personal-assistant = "assistant.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "A",    # builtin shadowing
    "ANN",  # missing annotations
    "ARG",  # unused arguments
    "B",    # bugbear
    "C4",   # comprehensions
    "D",    # docstrings
    "DTZ",  # naive datetimes
    "E",    # pycodestyle errors
    "EM",   # exception messages
    "ERA",  # commented-out code
    "F",    # pyflakes
    "FBT",  # boolean traps
    "I",    # import order
    "N",    # naming
    "PL",   # pylint
    "PTH",  # pathlib
    "RET",  # return simplification
    "RUF",  # ruff-specific
    "S",    # bandit
    "SIM",  # simplification
    "T20",  # print statements
    "TID",  # tidy imports
    "TRY",  # exception antipatterns
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
