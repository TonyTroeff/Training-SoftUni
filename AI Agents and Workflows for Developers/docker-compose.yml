services:
  n8n:
    image: n8nio/n8n:2.33.3
    container_name: softuni_ai_n8n
    ports:
      - 5678:5678
    volumes:
      - n8n_data:/home/node/.n8n

  chromadb:
    image: chromadb/chroma:1.5.9
    container_name: softuni_ai_chromadb
    ports:
      - 8000:8000
    volumes:
      - chromadb_data:/data

volumes:
  n8n_data:
  chromadb_data:


networks:
  default:
    name: softuni.ai
